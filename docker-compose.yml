# docker compose up --build
#   web    http://localhost:3000
#   admin  http://localhost:3001
#   api    http://localhost:4000/docs
# then seed once:  docker compose exec api node dist/seed.js   (credentials: /repo/seed-credentials.txt in the api container)
#
# Secrets below are development defaults — override them (e.g. in a .env next to this file) for any shared environment.
x-api-env: &api-env
  NODE_ENV: production
  DATABASE_URL: postgresql://goalbet:goalbet@postgres:5432/goalbet
  REDIS_URL: redis://redis:6379
  JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-dev-access-secret-change-me-0123456789abcdef}
  JWT_ADMIN_SECRET: ${JWT_ADMIN_SECRET:-dev-admin-secret-change-me-0123456789abcdef}
  WEB_ORIGIN: http://localhost:3000
  ADMIN_ORIGIN: http://localhost:3001
  # Plain HTTP on localhost; set true behind HTTPS.
  COOKIE_SECURE: ${COOKIE_SECURE:-false}
  ODDS_PROVIDER: ${ODDS_PROVIDER:-mock}
  API_FOOTBALL_KEY: ${API_FOOTBALL_KEY:-}
  # Production refuses MOCK_CONTROL_ENABLED=true; the demo stack runs mock control off.
  MOCK_CONTROL_ENABLED: 'false'
  # local demo over http with example secrets; never set this on a real deployment
  ALLOW_INSECURE_LOCAL: 'true'
  LOG_LEVEL: info
  SENTRY_DSN: ${SENTRY_DSN:-}

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: goalbet
      POSTGRES_PASSWORD: goalbet
      POSTGRES_DB: goalbet
    ports: ['5432:5432']
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U goalbet']
      interval: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    ports: ['6379:6379']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      retries: 20

  api:
    build: { context: ., target: api }
    environment: *api-env
    ports: ['4000:4000']
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:4000/health || exit 1']
      interval: 10s
      retries: 30

  worker:
    build: { context: ., target: worker }
    environment: *api-env
    depends_on:
      api: { condition: service_healthy }

  web:
    build: { context: ., target: web, args: { API_URL: http://api:4000 } }
    ports: ['3000:3000']
    depends_on: [api]

  admin:
    build: { context: ., target: admin, args: { API_URL: http://api:4000 } }
    ports: ['3001:3001']
    depends_on: [api]

volumes:
  pgdata:
