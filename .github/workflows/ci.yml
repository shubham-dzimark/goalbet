name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: goalbet
          POSTGRES_PASSWORD: goalbet
          POSTGRES_DB: goalbet_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U goalbet" --health-interval 5s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql://goalbet:goalbet@localhost:5432/goalbet_test
      TEST_REDIS_URL: redis://localhost:6379/1
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install -g pnpm@12.14.0
      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm turbo run build
      - name: Lint
        run: pnpm turbo run lint
      - name: Typecheck
        run: pnpm turbo run typecheck
      - name: Test (unit + API integration + i18n parity)
        run: pnpm turbo run test

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    needs: check
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: goalbet
          POSTGRES_PASSWORD: goalbet
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U goalbet" --health-interval 5s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-retries 20
    env:
      E2E_DB_BASE: postgresql://goalbet:goalbet@localhost:5432
      E2E_REDIS_BASE: redis://localhost:6379
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install -g pnpm@12.14.0
      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run build --filter=@goalbet/api --filter=@goalbet/worker
      - name: Playwright browser
        run: pnpm --filter @goalbet/e2e exec playwright install --with-deps chromium
      - name: E2E stack (database, builds)
        run: pnpm --filter @goalbet/e2e prepare-stack --rebuild
      - name: E2E (desktop 1440 px + mobile 375 px)
        run: pnpm --filter @goalbet/e2e e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: e2e/playwright-report
