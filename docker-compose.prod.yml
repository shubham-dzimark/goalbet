# Production stack for a single server (VPS).
#   docker compose -f docker-compose.prod.yml --env-file .env up -d --build
# Every secret comes from .env next to this file (see deploy/vps/env.example); nothing has a default.
# Only Caddy is published (deploy/vps/Caddyfile): /api/* goes to the API with the real client IP,
# the rest to the web or admin frontend. Postgres, Redis, the API and the frontends stay internal.
# Seed once:  docker compose -f docker-compose.prod.yml exec api node dist/seed.js
name: goalbet

x-logging: &logging
  driver: json-file
  options: { max-size: '10m', max-file: '3' }

x-api-env: &api-env
  NODE_ENV: production
  DATABASE_URL: postgresql://goalbet:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/goalbet
  REDIS_URL: redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD}@redis:6379
  JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?set JWT_ACCESS_SECRET}
  JWT_ADMIN_SECRET: ${JWT_ADMIN_SECRET:?set JWT_ADMIN_SECRET}
  WEB_ORIGIN: ${WEB_ORIGIN:?set WEB_ORIGIN}
  ADMIN_ORIGIN: ${ADMIN_ORIGIN:?set ADMIN_ORIGIN}
  EXTRA_ORIGINS: ${EXTRA_ORIGINS:-}
  # true behind HTTPS; plain-HTTP hosting on a bare IP needs false + ALLOW_INSECURE_LOCAL=true
  COOKIE_SECURE: ${COOKIE_SECURE:-true}
  ALLOW_INSECURE_LOCAL: ${ALLOW_INSECURE_LOCAL:-false}
  ODDS_PROVIDER: ${ODDS_PROVIDER:-mock}
  API_FOOTBALL_KEY: ${API_FOOTBALL_KEY:-}
  API_FOOTBALL_DAILY_BUDGET: ${API_FOOTBALL_DAILY_BUDGET:-90}
  MOCK_CONTROL_ENABLED: 'false'
  JOBS_MODE: worker
  LOG_LEVEL: info
  LOG_PRETTY: 'false'
  SENTRY_DSN: ${SENTRY_DSN:-}
  SMTP_URL: ${SMTP_URL:-}

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    logging: *logging
    environment:
      POSTGRES_USER: goalbet
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: goalbet
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U goalbet']
      interval: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    logging: *logging
    command: ['redis-server', '--requirepass', '${REDIS_PASSWORD:?set REDIS_PASSWORD}', '--appendonly', 'yes']
    volumes: [redisdata:/data]
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli -a "$$REDIS_PASSWORD" --no-auth-warning ping | grep PONG']
      interval: 5s
      retries: 20
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD}

  api:
    build: { context: ., target: api }
    restart: unless-stopped
    logging: *logging
    environment: *api-env
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:4000/health || exit 1']
      interval: 10s
      retries: 30

  worker:
    build: { context: ., target: worker }
    restart: unless-stopped
    logging: *logging
    environment: *api-env
    depends_on:
      api: { condition: service_healthy }

  web:
    build: { context: ., target: web, args: { API_URL: http://api:4000 } }
    restart: unless-stopped
    logging: *logging
    # server-side rendering calls the API directly at run time (the /api rewrite is baked at build)
    environment: { API_URL: http://api:4000 }
    depends_on:
      api: { condition: service_healthy }

  admin:
    build: { context: ., target: admin, args: { API_URL: http://api:4000 } }
    restart: unless-stopped
    logging: *logging
    # server-side rendering calls the API directly at run time (the /api rewrite is baked at build)
    environment: { API_URL: http://api:4000 }
    depends_on:
      api: { condition: service_healthy }

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    logging: *logging
    ports: ['${WEB_PORT:-80}:80', '443:443', '${ADMIN_PORT:-8080}:8080']
    volumes:
      - ./deploy/vps/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
      - caddyconfig:/config
    depends_on: [web, admin, api]

volumes:
  pgdata:
  redisdata:
  caddydata:
  caddyconfig:
